name: Prepare release
on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm release:prepare
      - name: Validate tag and create a draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/prepare-release.mjs "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" --draft --verify-tag --title "Jelly $RELEASE_TAG" --notes-file dist/release/release-notes.md dist/release/main.js dist/release/manifest.json dist/release/styles.css dist/release/jelly-*.zip dist/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: jelly-release
          path: dist/release/
